<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>شركة الدكروري للمواد الغذائية | نظام الحسابات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C4A5E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الدكروري">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#2C4A5E;
  --navy-dark:#1E3644;
  --navy-light:#3C6280;
  --gold:#F2B134;
  --bg:#EEF2F5;
  --card:#FFFFFF;
  --text:#1C2B35;
  --muted:#6B7C87;
  --border:#DCE4EA;
  --danger:#D64545;
  --success:#2E9E5B;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);direction:rtl}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer}
a{color:var(--navy-light);text-decoration:none}
.hidden{display:none !important}

/* ===== LOGIN ===== */
#login-screen{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-dark) 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--card);border-radius:20px;padding:36px 28px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.login-logo{width:96px;height:96px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.login-card h1{font-size:20px;margin:0 0 4px}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.field{text-align:right;margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:#F7F9FA;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-light)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer}
.btn-block{width:100%}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:active{background:var(--navy-dark)}
.btn-outline{background:#fff;border:1px solid var(--navy);color:var(--navy)}
.btn-accent{background:var(--gold);color:var(--navy-dark)}
.btn-danger{background:#FBE4E4;color:var(--danger)}
.login-error{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:4px}

/* ===== APP SHELL ===== */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar .title-wrap{flex:1;text-align:center}
.topbar .title-wrap h2{margin:0;font-size:17px}
.topbar .title-wrap .desc{font-size:11px;opacity:.75;margin-top:2px}
.icon-btn{background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;display:flex;align-items:center;justify-content:center}
.back-btn{background:none;border:none;color:#fff;font-size:20px}

/* drawer */
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
#drawer{position:fixed;top:0;right:0;height:100%;width:78%;max-width:300px;background:var(--navy-dark);color:#fff;z-index:41;transform:translateX(100%);transition:transform .25s;padding:20px 0;overflow-y:auto}
#drawer.open{transform:translateX(0)}
#drawerOverlay.open{display:block}
.drawer-head{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.drawer-head .lg{width:56px;height:56px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.drawer-head h3{margin:0;font-size:15px}
.drawer-head .sub{font-size:11px;opacity:.7}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 20px;color:#fff;opacity:.85;font-size:14.5px}
.nav-item.active{background:rgba(255,255,255,.08);opacity:1;border-right:3px solid var(--gold)}
.nav-item .ic{font-size:18px;width:22px;text-align:center}
.logout-item{margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;color:#FF9B9B}

main{flex:1;padding:16px;padding-bottom:90px;max-width:720px;margin:0 auto;width:100%}

/* ===== DASHBOARD ===== */
.dash-tile{border-radius:16px;overflow:hidden;position:relative;height:120px;display:flex;align-items:flex-end;background-size:cover;background-position:center;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.dash-tile.full{height:150px}
.dash-tile .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(44,74,94,0) 40%,rgba(30,54,68,.85) 100%)}
.dash-tile .label{position:relative;z-index:1;color:#fff;font-weight:700;font-size:15px;padding:12px 16px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dash-grid .dash-tile{margin-bottom:0}

/* ===== SEARCH / TABLE ===== */
.search-box{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:14px;font-size:15px}
.search-label{font-size:13px;color:var(--muted);margin-bottom:6px}
table.list-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
table.list-table th{background:var(--navy);color:#fff;padding:12px 10px;font-size:13px;text-align:center;font-weight:600}
table.list-table th.sortable{cursor:pointer;user-select:none}
table.list-table td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--border);font-size:14px}
table.list-table tr:last-child td{border-bottom:none}
table.list-table tr:active{background:#F5F8FA}

.fab{position:fixed;bottom:24px;left:20px;width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:26px;box-shadow:0 6px 16px rgba(44,74,94,.4);z-index:15;display:flex;align-items:center;justify-content:center}

.empty-state{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,38,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:400px;overflow:hidden}
.modal-title{background:#F5F8FA;padding:16px;text-align:center;font-weight:700;border-bottom:1px solid var(--border)}
.modal-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-row label{font-size:14px;color:var(--muted)}
.modal-row input{width:130px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:15px}
.modal-actions{display:flex}
.modal-actions button{flex:1;padding:15px;border:none;background:#fff;font-weight:700;font-size:15px}
.modal-actions .close-btn{color:var(--muted);border-left:1px solid var(--border)}
.modal-actions .ok-btn{color:var(--navy)}

/* ===== INVOICE ===== */
.invoice-add-row{display:flex;gap:8px;margin-bottom:14px}
.invoice-add-row input{flex:1}
.invoice-add-row .btn{white-space:nowrap}
.invoice-total-bar{background:#fff;border-radius:12px;padding:14px 16px;text-align:center;font-size:16px;font-weight:700;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.invoice-total-bar span{color:var(--navy)}
.invoice-actions{display:flex;gap:10px}
.invoice-actions .btn{flex:1}

/* ===== TABS ===== */
.tabbar{display:flex;background:var(--navy);border-radius:12px 12px 0 0;overflow-x:auto}
.tabbar button{flex:1;white-space:nowrap;background:none;border:none;color:rgba(255,255,255,.65);padding:14px 10px;font-size:13.5px;font-weight:600;border-bottom:3px solid transparent}
.tabbar button.active{color:var(--gold);border-bottom-color:var(--gold)}
.subtabbar{display:flex;background:var(--navy-light);overflow-x:auto}
.subtabbar button{flex:1;white-space:nowrap;background:none;border:none;color:rgba(255,255,255,.7);padding:11px 8px;font-size:12.5px;font-weight:600;border-bottom:3px solid transparent}
.subtabbar button.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-content{background:var(--bg);padding-top:14px}

.period-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.period-card .p-label{color:var(--muted);font-size:13px;margin-bottom:4px}
.period-card .p-value{font-size:22px;font-weight:700;color:var(--navy)}
.period-card .p-value.rank{font-size:15px;font-weight:600;color:var(--navy-light);line-height:1.7}

.stat-row{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:15px 16px;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-row .s-label{font-size:13.5px;color:var(--muted)}
.stat-row .s-value{font-size:17px;font-weight:700;color:var(--navy)}

.report-row{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:16px;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);font-weight:600}
.report-row .arrow{color:var(--muted)}

.date-filter-bar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.date-filter-bar select{background:none;border:none;color:var(--gold);font-size:14px;font-weight:600}
.date-filter-bar select option{color:#000}

.page-title-row{margin-bottom:14px}
.page-title-row h2{margin:0;font-size:19px}
.page-title-row .desc{color:var(--muted);font-size:12.5px;margin-top:2px}

.panel{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.panel h3{margin:0 0 12px;font-size:15.5px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:600}
.badge-success{background:#E4F6EB;color:var(--success)}
.hist-link{color:var(--navy-light);font-size:12.5px;text-decoration:underline}

#printArea{display:none}
@media print{
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important;direction:rtl;font-family:Tahoma,Arial,sans-serif}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v6c0 5 3.8 9.4 9 11 5.2-1.6 9-6 9-11V7l-9-5z" fill="#F2B134"/></svg>
    </div>
    <h1>شركة الدكروري للمواد الغذائية</h1>
    <div class="sub">نظام إدارة الحسابات والمخزون</div>
    <div class="login-error" id="loginError"></div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" style="display:none">
  <input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)">

  <div class="topbar">
    <button class="icon-btn" onclick="toggleDrawer(true)">☰</button>
    <div class="title-wrap">
      <h2 id="topTitle">Cashier</h2>
      <div class="desc" id="topDesc"></div>
    </div>
    <button class="icon-btn" id="backBtn" style="display:none" onclick="goBack()">←</button>
  </div>

  <div id="drawerOverlay" onclick="toggleDrawer(false)"></div>
  <div id="drawer">
    <div class="drawer-head">
      <div class="lg"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v6c0 5 3.8 9.4 9 11 5.2-1.6 9-6 9-11V7l-9-5z" fill="#F2B134"/></svg></div>
      <h3>شركة الدكروري</h3>
      <div class="sub">نظام إدارة الحسابات</div>
    </div>
    <div id="navList"></div>
  </div>

  <main id="content"></main>
  <div id="printArea"></div>
</div>

<div id="scannerOverlay" style="display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:#111">
    <span style="color:#fff;font-weight:700">وجّه الكاميرا نحو الباركود</span>
    <button onclick="closeBarcodeScanner()" style="background:none;border:none;color:#fff;font-size:22px">✕</button>
  </div>
  <video id="scannerVideo" autoplay playsinline muted style="flex:1;width:100%;object-fit:cover"></video>
  <div style="padding:14px;background:#111;color:#ccc;font-size:12px;text-align:center">لو الكاميرا مش شغالة أو مش شايف الباركود، اقفل واستخدم "او ادخل رقم الباركود يدوياً"</div>
</div>

<script>
/* ================= STATE / STORAGE ================= */
const state = { items:[], customers:[], suppliers:[], sales:[], purchases:[], expenses:[], stocktakes:[], priceHistory:[] };
const KEYS = ['items','customers','suppliers','sales','purchases','expenses','stocktakes','priceHistory'];

async function loadAll(){
  for(const k of KEYS){
    try{
      const v = localStorage.getItem('dekroure_accounting_' + k);
      state[k] = v ? JSON.parse(v) : [];
    }catch(e){ state[k] = []; }
  }
}
function saveKey(k){
  try{ localStorage.setItem('dekroure_accounting_' + k, JSON.stringify(state[k])); }
  catch(e){ console.error('save failed', k, e); }
}
function saveAll(){ KEYS.forEach(saveKey); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ================= LOGIN ================= */
function doLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  if(pass === '2030Ee'){
    err.textContent = '';
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    render('dashboard');
  }else{
    err.textContent = 'كلمة المرور غير صحيحة';
  }
}
function logout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('loginPass').value='';
}

/* ================= NAV / DRAWER ================= */
const NAV_ITEMS = [
  {id:'dashboard', ic:'🏠', label:'الرئيسية'},
  {id:'warehouse', ic:'📦', label:'مخزن المنتجات'},
  {id:'sale', ic:'🛒', label:'بيع'},
  {id:'purchase', ic:'🧾', label:'شراء'},
  {id:'customers', ic:'👥', label:'العملاء'},
  {id:'suppliers', ic:'🚚', label:'الموردين'},
  {id:'accounts', ic:'📊', label:'إدارة الحسابات'},
  {id:'expenses', ic:'💵', label:'المصروفات'},
  {id:'stocktakes', ic:'📋', label:'الجرد'},
  {id:'expiryAlerts', ic:'⏰', label:'تنبيهات الصلاحية'},
  {id:'settings', ic:'⚙️', label:'الإعدادات والنسخ الاحتياطي'},
];
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('open', open);
  document.getElementById('drawerOverlay').classList.toggle('open', open);
}
function renderNav(activeView){
  const html = NAV_ITEMS.map(n=>`
    <div class="nav-item ${n.id===activeView?'active':''}" onclick="toggleDrawer(false);render('${n.id}')">
      <span class="ic">${n.ic}</span><span>${n.label}</span>
    </div>
  `).join('') + `<div class="nav-item logout-item" onclick="toggleDrawer(false);logout()"><span class="ic">🚪</span><span>تسجيل خروج</span></div>`;
  document.getElementById('navList').innerHTML = html;
}

/* ================= ROUTER ================= */
let currentView = 'dashboard';
let currentParams = null;
let navHistory = [];
let accountsTab = 'overview';
let overviewSub = 'sales';
let aggSub = 'sales';
let dateFilter = 'today';
let saleDraft = { lines:[], discount:0, paid:null, customerId:'' };
let purchaseDraft = { lines:[], paid:null, supplierId:'' };
let sortState = { key:'name', dir:1 };

function render(view, params, fromBack){
  if(!fromBack && currentView && (view!==currentView || JSON.stringify(params||null)!==JSON.stringify(currentParams))){
    navHistory.push({view: currentView, params: currentParams});
  }
  currentView = view;
  currentParams = params || null;
  const titles = {
    dashboard:['Cashier',''],
    warehouse:['مخزن المنتجات',''],
    warehouseForm:['منتج جديد',''],
    sale:['فاتورة بيع جديدة',''],
    salesInvoices:['فواتير البيع',''],
    saleInvoiceView:['تفاصيل فاتورة البيع',''],
    purchase:['فاتورة شراء جديدة',''],
    purchaseInvoices:['فواتير الشراء',''],
    purchaseInvoiceView:['تفاصيل فاتورة الشراء',''],
    customers:['العملاء',''],
    customerForm:['عميل جديد',''],
    suppliers:['الموردين',''],
    supplierForm:['مورد جديد',''],
    accounts:['ادارة الحسابات',''],
    expenses:['المصروفات',''],
    expenseForm:['مصروف جديد',''],
    stocktakes:['الجرد',''],
    stocktakeForm:['جرد جديد',''],
    stocktakeView:['تفاصيل الجرد',''],
    expiryAlerts:['تنبيهات الصلاحية',''],
    settings:['الإعدادات والنسخ الاحتياطي',''],
  };
  document.getElementById('topTitle').textContent = (titles[view]||['',''])[0];
  document.getElementById('topDesc').textContent = (titles[view]||['',''])[1];
  renderNav(view);
  const c = document.getElementById('content');
  if(view==='dashboard') c.innerHTML = renderDashboard();
  else if(view==='warehouse') c.innerHTML = renderWarehouse();
  else if(view==='warehouseForm') c.innerHTML = renderWarehouseForm(params);
  else if(view==='sale') c.innerHTML = renderSale();
  else if(view==='salesInvoices') c.innerHTML = renderSalesInvoices();
  else if(view==='saleInvoiceView') c.innerHTML = renderSaleInvoiceView(params);
  else if(view==='purchase') c.innerHTML = renderPurchase();
  else if(view==='purchaseInvoices') c.innerHTML = renderPurchaseInvoices();
  else if(view==='purchaseInvoiceView') c.innerHTML = renderPurchaseInvoiceView(params);
  else if(view==='customers') c.innerHTML = renderPeopleList('customers','customer');
  else if(view==='customerForm') c.innerHTML = renderPersonForm('customers', params);
  else if(view==='suppliers') c.innerHTML = renderPeopleList('suppliers','supplier');
  else if(view==='supplierForm') c.innerHTML = renderPersonForm('suppliers', params);
  else if(view==='accounts') c.innerHTML = renderAccounts();
  else if(view==='expenses') c.innerHTML = renderExpenses();
  else if(view==='expenseForm') c.innerHTML = renderExpenseForm(params);
  else if(view==='stocktakes') c.innerHTML = renderStocktakes();
  else if(view==='stocktakeForm') c.innerHTML = renderStocktakeForm();
  else if(view==='stocktakeView') c.innerHTML = renderStocktakeView(params);
  else if(view==='expiryAlerts') c.innerHTML = renderExpiryAlertsPage();
  else if(view==='settings') c.innerHTML = renderSettings();
  document.getElementById('backBtn').style.display = (view==='dashboard') ? 'none' : 'flex';
  window.scrollTo(0,0);
}
function goBack(){
  if(navHistory.length){
    const prev = navHistory.pop();
    render(prev.view, prev.params, true);
  }else{
    render('dashboard', null, true);
  }
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  return `
  <div class="dash-tile full" style="background:linear-gradient(135deg,#3C6280,#2C4A5E)" onclick="render('warehouse')">
    <div class="ic" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;opacity:.85">📦</div>
    <div class="overlay"></div>
    <div class="label">مخزن المنتجات</div>
  </div>
  <div class="dash-grid" style="margin-bottom:12px">
    <div class="dash-tile" style="background:linear-gradient(135deg,#2E9E5B,#1E6B3D)" onclick="startNewSale()">
      <div class="ic" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;opacity:.85">🛒</div>
      <div class="overlay"></div><div class="label">بيع</div>
    </div>
    <div class="dash-tile" style="background:linear-gradient(135deg,#3C6280,#2C4A5E)" onclick="startNewPurchase()">
      <div class="ic" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;opacity:.85">🧾</div>
      <div class="overlay"></div><div class="label">شراء</div>
    </div>
  </div>

function getExpiryStatus(expiry){
  if(!expiry) return null;
  const days = Math.ceil((new Date(expiry) - new Date(new Date().toDateString())) / 86400000);
  if(days < 0) return {level:'expired', days, label:'منتهي الصلاحية'};
  if(days <= 30) return {level:'soon', days, label:`باقي ${days} يوم`};
  return {level:'ok', days, label:''};
}
function renderExpiryBanner(){
  const alerts = state.items.map(it=>({it, st:getExpiryStatus(it.expiry)})).filter(x=>x.st && x.st.level!=='ok');
  if(!alerts.length) return '';
  const expiredCount = alerts.filter(x=>x.st.level==='expired').length;
  const soonCount = alerts.filter(x=>x.st.level==='soon').length;
  return `
  <div class="panel" style="border:1px solid #F2C4A0;background:#FFF6EE;margin-top:14px" onclick="render('expiryAlerts')">
    <h3 style="color:#B0532E">⏰ تنبيهات الصلاحية</h3>
    <div style="font-size:14px;color:#7A502E">
      ${expiredCount?`<div>🔴 ${expiredCount} منتج منتهي الصلاحية</div>`:''}
      ${soonCount?`<div>🟠 ${soonCount} منتج قرب انتهاء صلاحيته</div>`:''}
    </div>
  </div>
  `;
}

/* ================= BARCODE: CAMERA SCANNER ================= */
let scannerStream = null;
let scannerInputId = null;
let scannerRAF = null;
async function openBarcodeScanner(inputId){
  scannerInputId = inputId;
  if(!('BarcodeDetector' in window)){
    alert('الكاميرا لقراءة الباركود مش مدعومة على المتصفح ده. استخدم "او ادخل رقم الباركود" بدل كده.');
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('تعذر الوصول للكاميرا على هذا الجهاز. استخدم "او ادخل رقم الباركود" بدل كده.');
    return;
  }
  const overlay = document.getElementById('scannerOverlay');
  const video = document.getElementById('scannerVideo');
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    alert('تعذر فتح الكاميرا. تأكد إنك سمحت للموقع باستخدام الكاميرا من إعدادات المتصفح.');
    return;
  }
  video.srcObject = scannerStream;
  overlay.style.display = 'flex';
  let detector;
  try{
    detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf'] });
  }catch(e){
    detector = new BarcodeDetector();
  }
  const scanLoop = async () => {
    if(!scannerStream) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length){
        const value = codes[0].rawValue;
        closeBarcodeScanner();
        applyScannedBarcode(scannerInputId, value);
        return;
      }
    }catch(e){}
    scannerRAF = requestAnimationFrame(scanLoop);
  };
  scannerRAF = requestAnimationFrame(scanLoop);
}
function closeBarcodeScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
  const overlay = document.getElementById('scannerOverlay');
  if(overlay) overlay.style.display = 'none';
}

function piecesLabel(it){

function ensurePersonByName(key, name){
  name = (name||'').trim();
  if(!name) return '';
  let p = state[key].find(x=>x.name===name);
  if(!p){ p = { id: uid(), name, address:'', phone:'', notes:'' }; state[key].push(p); saveKey(key); }
  return p.id;
}
function nextInvoiceNo(arr){ return arr.length ? Math.max(...arr.map(x=>x.invoiceNo||0)) + 1 : 1; }
function confirmSaleCheckout(){
  const c = saleCheckout;
  const netTotal = Math.max(0, c.total - (Number(c.discount)||0));
  const paid = c.fullyPaid ? netTotal : (Number(c.paidManual)||0);
  if(editingSaleId && editingSaleOriginal){
    editingSaleOriginal.lines.forEach(l=>{
      const it = state.items.find(x=>x.id===l.itemId);
      if(it) it.qty += l.qty;
    });
  }
  for(const l of saleDraft.lines){
    const it = state.items.find(x=>x.id===l.itemId);
    if(it) it.qty = Math.max(0, it.qty - l.qty);
  }
  const customerId = ensurePersonByName('customers', c.customerName);

function confirmPurchaseModal(){
  const m = purchaseModal;
  if(!m.qty || m.qty<=0){ alert('من فضلك ادخل كمية أكبر من صفر'); return; }
  let itemId = m.itemId;
  if(!itemId){
    const newItem = { id: uid(), name:m.name, barcode:m.barcode, qty:0, buyPrice:m.buyPrice, sellPrice:m.sellPrice, desc:'', category:'' };
    state.items.push(newItem);
    itemId = newItem.id;
  }else{
    const it = state.items.find(x=>x.id===itemId);
    if(it.buyPrice !== m.buyPrice){
      state.priceHistory.push({ id: uid(), itemId, name: it.name, oldPrice: it.buyPrice, newPrice: m.buyPrice, date: new Date().toISOString() });
      saveKey('priceHistory');
    }
    it.buyPrice = m.buyPrice; it.sellPrice = m.sellPrice; if(m.barcode) it.barcode = m.barcode;
  }
  purchaseDraft.lines.push({ itemId, name:m.name, qty:m.qty, buyPrice:m.buyPrice, sellPrice:m.sellPrice });
  purchaseModal = null;
  document.getElementById('purchaseInput') && (document.getElementById('purchaseInput').value='');
  saveKey('items');
  render('purchase');
}

  const code = prompt('ادخل رقم الباركود');

  purchaseModal = existing
    ? { name: existing.name, itemId: existing.id, qty:0, buyPrice: existing.buyPrice, sellPrice: existing.sellPrice, barcode: existing.barcode||'' }

function confirmPurchaseCheckout(){
  const c = purchaseCheckout;
  const paid = c.fullyPaid ? c.total : (Number(c.paidManual)||0);
  if(editingPurchaseId && editingPurchaseOriginal){
    editingPurchaseOriginal.lines.forEach(l=>{
      const it = state.items.find(x=>x.id===l.itemId);
      if(it) it.qty = Math.max(0, it.qty - l.qty);

  for(const l of purchaseDraft.lines){

/* ================= DATE RANGES ================= */
const OVERVIEW_PERIODS = [
  {key:'today', label:'اليوم'},
  {key:'yesterday', label:'أمس'},
  {key:'thisMonth', label:'هذا الشهر'},
  {key:'lastMonth', label:'الشهر الماضى'},
  {key:'all', label:'مدى العمل'},
];
const PERIODS = [
  {key:'today', label:'اليوم'},
  {key:'yesterday', label:'أمس'},
  {key:'last7', label:'اخر 7 ايام'},
  {key:'thisMonth', label:'هذا الشهر'},
  {key:'last30', label:'اخر 30 يوم'},
  {key:'lastMonth', label:'الشهر الماضى'},
  {key:'all', label:'مدى العمل'},
  {key:'custom', label:'تاريخ خاص...'},
];
let customRange = { from: todayISO(), to: todayISO() };
function getRange(period){
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if(period==='today'){ const s=startOfDay(now); return [s, new Date(s.getTime()+86400000)]; }
  if(period==='yesterday'){ const s=startOfDay(now); s.setDate(s.getDate()-1); return [s, new Date(s.getTime()+86400000)]; }
  if(period==='last7'){ const e=startOfDay(now); e.setDate(e.getDate()+1); const s=new Date(e.getTime()-7*86400000); return [s,e]; }
  if(period==='thisMonth'){ const s=new Date(now.getFullYear(), now.getMonth(),1); return [s, new Date(now.getFullYear(), now.getMonth()+1,1)]; }
  if(period==='last30'){ const e=startOfDay(now); e.setDate(e.getDate()+1); const s=new Date(e.getTime()-30*86400000); return [s,e]; }
  if(period==='lastMonth'){ const s=new Date(now.getFullYear(), now.getMonth()-1,1); return [s, new Date(now.getFullYear(), now.getMonth(),1)]; }
  if(period==='custom'){ const s=new Date(customRange.from); const e=new Date(customRange.to); e.setDate(e.getDate()+1); return [s,e]; }
  return [new Date(0), new Date(8640000000000000)];
}
function inRange(dateStr, range){ const d = new Date(dateStr); return d>=range[0] && d<range[1]; }
function salesIn(period){ const r=getRange(period); return state.sales.filter(s=>inRange(s.date,r)); }
function purchasesIn(period){ const r=getRange(period); return state.purchases.filter(s=>inRange(s.date,r)); }
function expensesIn(period){ const r=getRange(period); return state.expenses.filter(s=>inRange(s.date,r)); }

function salesTotal(period){ return salesIn(period).reduce((a,s)=>a+s.total,0); }
function salesProfit(period){
  return salesIn(period).reduce((a,s)=>{
    const lineProfit = s.lines.reduce((x,l)=>x + l.qty*(l.price-(l.cost||0)), 0);
    return a + lineProfit - (s.discount||0);
  },0);
}
function topProducts(period, by){ // by: 'qty' or 'profit'
  const map = {};
  salesIn(period).forEach(s=>{
    s.lines.forEach(l=>{
      if(!map[l.name]) map[l.name] = {qty:0, profit:0};
      map[l.name].qty += l.qty;
      map[l.name].profit += l.qty*(l.price-(l.cost||0));
    });
  });
  const arr = Object.entries(map).map(([name,v])=>({name, ...v}));
  arr.sort((a,b)=> by==='qty' ? b.qty-a.qty : b.profit-a.profit);
  return arr.slice(0,3);
}

function renderAggregatedTab(){
  const r = dateFilter;
  let rows;
  if(aggSub==='sales'){
    const gross = salesIn(r).reduce((a,s)=>a + s.lines.reduce((x,l)=>x+l.qty*l.price,0), 0);
    const discounts = salesIn(r).reduce((a,s)=>a+(s.discount||0),0);
    const net = gross - discounts;
    const cash = salesIn(r).reduce((a,s)=>a+(s.paid!=null?s.paid:s.total),0);
    const remaining = salesIn(r).reduce((a,s)=>a + Math.max(0,(s.total-(s.paid!=null?s.paid:s.total))),0);
    const profit = salesProfit(r);
    const exp = expensesIn(r).reduce((a,e)=>a+e.amount,0);
    const profitAfter = profit - exp;
    const pct = net>0 ? (profitAfter/net*100) : 0;
    rows = [
      ['اجمالى المبيعات', fmt(gross)],
      ['اجمالى الخصومات', fmt(discounts)],
      ['اجمالى المبيعات بعد الخصم', fmt(net)],
      ['اجمالى الايرادات النقدية', fmt(cash)],
      ['اجمالى المبالغ المتبقية عند العملاء', fmt(remaining)],
      ['اجمالى الارباح', fmt(profit)],
      ['اجمالى المصروفات', fmt(exp)],
      ['اجمالى الارباح بعد خصم المصروفات', fmt(profitAfter)],
      ['نسبة الارباح', pct.toFixed(2)+' %'],
    ];
  }else{
    const totalP = purchasesIn(r).reduce((a,p)=>a+p.total,0);
    const paid = purchasesIn(r).reduce((a,p)=>a+(p.paid!=null?p.paid:p.total),0);

      ['اجمالى المشتريات', fmt(totalP)],
      ['اجمالى المبالغ المدفوعة', fmt(paid)],
      ['اجمالى المبالغ المتبقية للموردين', fmt(remaining)],
    ];
  }
  return `
  <div class="subtabbar">
    <button class="${aggSub==='sales'?'active':''}" onclick="aggSub='sales';render('accounts')">المبيعات</button>

function lastStocktakeDate(){
  if(!state.stocktakes.length) return null;
  return state.stocktakes.slice().sort((a,b)=> new Date(b.date)-new Date(a.date))[0].date;
}
function dispensedSince(itemId, sinceDate){
  const since = sinceDate ? new Date(sinceDate) : new Date(0);
  return state.sales
    .filter(s => new Date(s.date) > since)
    .reduce((sum,s)=> sum + s.lines.filter(l=>l.itemId===itemId).reduce((a,l)=>a+l.qty,0), 0);
}
function startStocktake(type){
  const since = lastStocktakeDate();
  stocktakeDraft = {
    type,
    since,
    lines: state.items.map(it => ({
      itemId: it.id, name: it.name,
      systemQty: it.qty,
      dispensed: dispensedSince(it.id, since),
      countedQty: it.qty
    }))
  };

}

function backupData(){
  try{
    const payload = {
      app: 'نظام حسابات شركة الدكروري',
      version: 1,
      createdAt: new Date().toISOString(),
      state: state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    const name = `نسخة-احتياطية-الدكروري-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    alert('تم إنشاء النسخة الاحتياطية بنجاح.');
  }catch(e){
    console.error(e);
    alert('تعذر إنشاء النسخة الاحتياطية.');
  }
}

async function restoreData(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;

  if(!confirm('سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. هل تريد المتابعة؟')) return;

  try{
    const raw = await file.text();
    const payload = JSON.parse(raw);

    if(!payload || !payload.state || typeof payload.state !== 'object'){
      throw new Error('ملف النسخة الاحتياطية غير صالح');
    }

    for(const k of KEYS){
      const value = Array.isArray(payload.state[k]) ? payload.state[k] : [];
      state[k] = value;
      localStorage.setItem('dekroure_accounting_' + k, JSON.stringify(value));
    }

    alert('تمت استعادة البيانات بنجاح. سيتم تحديث البرنامج.');
    location.reload();
  }catch(e){
    console.error(e);
    alert('فشل الاستعادة: ملف النسخة الاحتياطية غير صالح أو تالف.');
  }
}

/* ================= GOOGLE DRIVE SYNC ================= */
const DRIVE_FILE_NAME = 'دكروري-نسخة-احتياطية.json';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const DEFAULT_GCLIENT_ID = '941736124236-ppvnnbj5bltqle91qkh4grngl9fdhpk4.apps.googleusercontent.com';
const G_TOKEN_KEY = 'dekroure_g_token';
const G_EMAIL_KEY = 'dekroure_g_email';
const G_EXPIRY_KEY = 'dekroure_g_expiry';
const G_CONNECTED_KEY = 'dekroure_g_connected';
let gClientId = DEFAULT_GCLIENT_ID;
let gAccessToken = null;
let gUserEmail = null;
let gTokenExpiry = 0;
let gTokenClient = null;
let gGoogleConnected = false;

function buildBackupPayload(){
  return {
    app: 'نظام حسابات شركة الدكروري',
    version: 1,
    createdAt: new Date().toISOString(),
    state: state
  };
}

(function restoreGoogleSession(){
  try{
    const tok = localStorage.getItem(G_TOKEN_KEY);
    const exp = Number(localStorage.getItem(G_EXPIRY_KEY) || 0);
    const email = localStorage.getItem(G_EMAIL_KEY);
    gGoogleConnected = localStorage.getItem(G_CONNECTED_KEY) === '1';
    if(tok && exp && exp > Date.now()){
      gAccessToken = tok;
      gTokenExpiry = exp;
      gUserEmail = email || null;
    }else if(email){
      gUserEmail = email;
    }
  }catch(e){}
})();

function persistGoogleSession(){
  try{
    if(gAccessToken){
      localStorage.setItem(G_TOKEN_KEY, gAccessToken);
      localStorage.setItem(G_EXPIRY_KEY, String(gTokenExpiry));
      if(gUserEmail) localStorage.setItem(G_EMAIL_KEY, gUserEmail);
      localStorage.setItem(G_CONNECTED_KEY, '1');
    }
  }catch(e){}
}

function clearGoogleSession(){
  try{
    localStorage.removeItem(G_TOKEN_KEY);
    localStorage.removeItem(G_EXPIRY_KEY);
    localStorage.removeItem(G_EMAIL_KEY);
    localStorage.removeItem(G_CONNECTED_KEY);
  }catch(e){}
}

function initGTokenClient(callback){
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    alert('تعذر تحميل خدمة تسجيل دخول جوجل، تأكد من اتصالك بالإنترنت وحاول مرة أخرى.');
    return null;
  }
  return google.accounts.oauth2.initTokenClient({
    client_id: gClientId,
    scope: DRIVE_SCOPES,
    callback: callback
  });
}

function handleTokenResponse(resp){
  return new Promise(async (resolve)=>{
    if(resp.error){ resolve(false); return; }
    gAccessToken = resp.access_token;
    const expiresInSec = Number(resp.expires_in || 3500);
    gTokenExpiry = Date.now() + (expiresInSec * 1000) - 60000;
    try{
      const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers:{ Authorization: 'Bearer ' + gAccessToken }
      });
      const info = await r.json();
      gUserEmail = info.email || gUserEmail || null;
    }catch(e){}
    gGoogleConnected = true;
    persistGoogleSession();
    resolve(true);
  });
}

function silentRenewGoogleToken(){
  return new Promise((resolve)=>{
    if(!gClientId || !window.google || !google.accounts || !google.accounts.oauth2){
      resolve(false); return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: gClientId,
      scope: DRIVE_SCOPES,
      hint: gUserEmail || undefined,
      callback: async (resp)=>{
        const ok = await handleTokenResponse(resp);
        resolve(ok);
      }
    });
    try{
      // تجديد صامت فقط؛ لا نفتح نافذة تسجيل الدخول تلقائياً.
      client.requestAccessToken({ prompt: 'none' });
    }catch(e){ resolve(false); }
  });
}

async function ensureAccessToken(){
  if(gAccessToken && gTokenExpiry > Date.now()) return true;
  // إذا سبق للمستخدم ربط الحساب على هذا الجهاز، حاول التجديد بصمت فقط.
  // ممنوع فتح نافذة تسجيل الدخول تلقائياً أثناء استخدام البرنامج.
  if(gGoogleConnected || gUserEmail){
    const renewed = await silentRenewGoogleToken();
    if(renewed) { render('settings'); return true; }
  }
  return false;
}

function connectGoogle(){
  if(!gClientId){ alert('من فضلك احفظ Client ID أولاً.'); return; }
  gTokenClient = initGTokenClient(async (resp)=>{
    const ok = await handleTokenResponse(resp);
    if(!ok){
      // إذا كان هذا تجديداً صامتاً فلا نزعج المستخدم.
      if(gGoogleConnected || gUserEmail) return;
      alert('فشل تسجيل الدخول: ' + (resp.error || ''));
      return;
    }
    render('settings');
  });
  if(!gTokenClient) return;
  // هذا الزر هو تسجيل دخول يدوي فقط؛ لا يتم استدعاؤه تلقائياً.
  // لذلك إذا احتاج الجهاز إعادة تفويض، تظهر نافذة جوجل مرة واحدة عند ضغط المستخدم.
  gTokenClient.requestAccessToken({ prompt: 'consent' });
}

function disconnectGoogle(){
  if(gAccessToken && window.google && google.accounts && google.accounts.oauth2){
    google.accounts.oauth2.revoke(gAccessToken, ()=>{});
  }
  gAccessToken = null;
  gUserEmail = null;
  gTokenExpiry = 0;
  clearGoogleSession();
  render('settings');
}

async function driveFindBackupFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`, {
    headers:{ Authorization: 'Bearer ' + gAccessToken }
  });
  if(!r.ok) throw new Error('drive list failed');
  const data = await r.json();
  return (data.files && data.files[0]) || null;
}

async function driveBackupNow(){
  const ok = await ensureAccessToken();
  if(!ok){ alert('من فضلك سجل الدخول بجوجل أولاً.'); return; }
  try{
    const existing = await driveFindBackupFile();
    const payload = JSON.stringify(buildBackupPayload(), null, 2);
    const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
    const boundary = 'dekroure_boundary_' + Date.now();
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(existing?{}:metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n` +
      `--${boundary}--`;
    const url = existing
      ? `https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const r = await fetch(url, {
      method: existing ? 'PATCH' : 'POST',
      headers:{
        Authorization: 'Bearer ' + gAccessToken,
        'Content-Type': `multipart/related; boundary=${boundary}`
      },
      body: body
    });
    if(!r.ok) throw new Error('upload failed: ' + r.status);
    const now = new Date().toLocaleString('ar-EG');
    localStorage.setItem('dekroure_drive_last_backup', now);
    alert('تم رفع النسخة الاحتياطية على جوجل درايف بنجاح.');
    render('settings');
  }catch(e){
    console.error(e);
    alert('تعذر رفع النسخة الاحتياطية على درايف. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.');
  }
}

async function driveRestoreLatest(){
  const ok = await ensureAccessToken();
  if(!ok){ alert('من فضلك سجل الدخول بجوجل أولاً.'); return; }
  try{
    const existing = await driveFindBackupFile();
    if(!existing){ alert('لا توجد نسخة احتياطية محفوظة على درايف بعد.'); return; }
    if(!confirm('سيتم استبدال البيانات الحالية بآخر نسخة محفوظة على جوجل درايف. هل تريد المتابعة؟')) return;
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${existing.id}?alt=media`, {
      headers:{ Authorization: 'Bearer ' + gAccessToken }
    });
    if(!r.ok) throw new Error('download failed');
    const payload = await r.json();
    if(!payload || !payload.state || typeof payload.state !== 'object'){
      throw new Error('invalid backup file');
    }
    for(const k of KEYS){
      const value = Array.isArray(payload.state[k]) ? payload.state[k] : [];
      state[k] = value;
      localStorage.setItem('dekroure_accounting_' + k, JSON.stringify(value));
    }
    alert('تمت استعادة البيانات من جوجل درايف بنجاح. سيتم تحديث البرنامج.');
    location.reload();
  }catch(e){
    console.error(e);
    alert('تعذر استعادة النسخة من درايف. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.');
  }
}
